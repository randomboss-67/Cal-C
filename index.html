<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cal-C</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon-512.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141218;
      --display-bg: #1D1B20;
      --num-bg: #2B2930;
      --num-text: #E6E0E9;
      --op-bg: #4A4458;
      --op-text: #E8DEF8;
      --fn-bg: #633B48;
      --fn-text: #FFD8E4;
      --oneplus-red: #EB0028;
      --text-secondary: #938F99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--num-text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .calculator-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      gap: 14px;
    }

    /* Display Card (Material 3 Expressive) */
    .display-card {
      flex: 1;
      min-height: 180px;
      background-color: var(--display-bg);
      border-radius: 36px;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: background-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .display-card.easter-egg-active {
      background-color: var(--oneplus-red);
    }

    /* App Header Logo */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.6px;
      color: #D0BCFF;
      background: rgba(208, 188, 255, 0.12);
      padding: 6px 16px;
      border-radius: 999px;
      transition: opacity 0.25s ease;
    }

    .display-card.easter-egg-active .app-logo {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.18);
    }

    /* Standard Calculator Readout */
    .readout-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 6px;
      margin-top: auto;
    }

    .expression-line {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-secondary);
      min-height: 30px;
      word-break: break-all;
      text-align: right;
    }

    .result-line {
      font-size: clamp(40px, 11vw, 60px);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.05;
      color: var(--num-text);
      word-break: break-all;
      text-align: right;
    }

    /* Clean Easter Egg View (Only 1+ Box & NEVER SETTLE) */
    .easter-egg-view {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 14px;
      margin-top: auto;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .display-card.easter-egg-active .readout-container {
      display: none;
    }

    .display-card.easter-egg-active .easter-egg-view {
      display: flex;
    }

    .oneplus-box {
      width: 44px;
      height: 44px;
      border: 3.5px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #FFFFFF;
      position: relative;
      letter-spacing: -1px;
    }

    .never-settle-title {
      font-size: clamp(32px, 9vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #FFFFFF;
      text-transform: uppercase;
      line-height: 1;
      text-align: right;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Keypad Grid (4x5 Pure Circles) */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 4px 2px 6px;
    }

    .calc-btn {
      aspect-ratio: 1 / 1;
      width: 100%;
      border: none;
      outline: none;
      /* Default shape: Pure Circle */
      border-radius: 50%;
      font-family: inherit;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      /* Bouncy M3 Expressive morph transition */
      transition:
        border-radius 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
        filter 0.15s ease;
    }

    /* Morph from Circle to Squircle when clicked/pressed */
    .calc-btn:active,
    .calc-btn.squircle-active {
      border-radius: 26%;
      transform: scale(0.92);
      filter: brightness(1.14);
    }

    .btn-num {
      background-color: var(--num-bg);
      color: var(--num-text);
    }

    .btn-op {
      background-color: var(--op-bg);
      color: var(--op-text);
    }

    .btn-fn {
      background-color: var(--fn-bg);
      color: var(--fn-text);
      font-size: clamp(19px, 5vw, 23px);
    }

    /* Always Red = Button */
    .btn-eq {
      background-color: var(--oneplus-red);
      color: #FFFFFF;
      font-size: clamp(26px, 7vw, 32px);
      box-shadow: 0 6px 20px rgba(235, 0, 40, 0.35);
    }

    sup {
      font-size: 0.6em;
      margin-left: 1px;
    }
  </style>
</head>
<body>

  <div class="calculator-shell">
    <!-- Top Display Card -->
    <div class="display-card" id="display-card">
      <div class="header-bar">
        <div class="app-logo">Cal-C</div>
      </div>

      <!-- Normal Calculator Output -->
      <div class="readout-container">
        <div class="expression-line" id="expression"></div>
        <div class="result-line" id="result">0</div>
      </div>

      <!-- OnePlus "1+ =" Easter Egg Output (Strictly Clean) -->
      <div class="easter-egg-view">
        <div class="oneplus-box">1+</div>
        <div class="never-settle-title">NEVER SETTLE</div>
      </div>
    </div>

    <!-- 4x5 Circular Keypad (Morphs to Squircle on Tap) -->
    <div class="keypad">
      <!-- Row 1: AC, Square, Cube, Divide -->
      <button class="calc-btn btn-fn" data-key="AC" onclick="pressButton(this, 'AC')">AC</button>
      <button class="calc-btn btn-fn" data-key="SQ" onclick="pressButton(this, 'SQ')">x<sup>2</sup></button>
      <button class="calc-btn btn-fn" data-key="CB" onclick="pressButton(this, 'CB')">x<sup>3</sup></button>
      <button class="calc-btn btn-op" data-key="÷" onclick="pressButton(this, '÷')">÷</button>

      <!-- Row 2: 7, 8, 9, Multiply -->
      <button class="calc-btn btn-num" data-key="7" onclick="pressButton(this, '7')">7</button>
      <button class="calc-btn btn-num" data-key="8" onclick="pressButton(this, '8')">8</button>
      <button class="calc-btn btn-num" data-key="9" onclick="pressButton(this, '9')">9</button>
      <button class="calc-btn btn-op" data-key="×" onclick="pressButton(this, '×')">×</button>

      <!-- Row 3: 4, 5, 6, Subtract -->
      <button class="calc-btn btn-num" data-key="4" onclick="pressButton(this, '4')">4</button>
      <button class="calc-btn btn-num" data-key="5" onclick="pressButton(this, '5')">5</button>
      <button class="calc-btn btn-num" data-key="6" onclick="pressButton(this, '6')">6</button>
      <button class="calc-btn btn-op" data-key="-" onclick="pressButton(this, '-')">−</button>

      <!-- Row 4: 1, 2, 3, Add -->
      <button class="calc-btn btn-num" data-key="1" onclick="pressButton(this, '1')">1</button>
      <button class="calc-btn btn-num" data-key="2" onclick="pressButton(this, '2')">2</button>
      <button class="calc-btn btn-num" data-key="3" onclick="pressButton(this, '3')">3</button>
      <button class="calc-btn btn-op" data-key="+" onclick="pressButton(this, '+')">+</button>

      <!-- Row 5: 0, Decimal, Backspace, Red Equals -->
      <button class="calc-btn btn-num" data-key="0" onclick="pressButton(this, '0')">0</button>
      <button class="calc-btn btn-num" data-key="." onclick="pressButton(this, '.')">.</button>
      <button class="calc-btn btn-fn" data-key="DEL" onclick="pressButton(this, 'DEL')">⌫</button>
      <button class="calc-btn btn-eq" data-key="=" onclick="pressButton(this, '=')">=</button>
    </div>
  </div>

  <script>
    let currentInput = "";
    let easterEggTriggered = false;

    const displayCard = document.getElementById("display-card");
    const exprEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");

    function triggerHaptic(ms = 12) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function animateSquircle(btn) {
      btn.classList.add("squircle-active");
      setTimeout(() => btn.classList.remove("squircle-active"), 220);
    }

    function exitEasterEggIfActive() {
      if (easterEggTriggered) {
        easterEggTriggered = false;
        displayCard.classList.remove("easter-egg-active");
        currentInput = "";
      }
    }

    function pressButton(btn, key) {
      triggerHaptic(key === "=" ? 22 : 10);
      animateSquircle(btn);

      if (key === "AC") {
        exitEasterEggIfActive();
        currentInput = "";
        updateScreen("", "0");
        return;
      }

      if (key === "DEL") {
        exitEasterEggIfActive();
        currentInput = currentInput.slice(0, -1);
        updateScreen(currentInput, currentInput || "0");
        return;
      }

      // Square (x²) or Cube (x³) of current value
      if (key === "SQ" || key === "CB") {
        exitEasterEggIfActive();
        const baseValue = evaluateExpression(currentInput || resultEl.innerText);
        if (baseValue === null || isNaN(baseValue)) return;

        const power = key === "SQ" ? 2 : 3;
        const symbol = key === "SQ" ? "²" : "³";
        const computed = Math.pow(baseValue, power);
        const formatted = formatResult(computed);

        updateScreen(`${formatResult(baseValue)}${symbol}`, formatted);
        currentInput = String(computed);
        return;
      }

      if (key === "=") {
        // Exact "1+" Easter Egg Check
        if (currentInput.replace(/\s+/g, "") === "1+") {
          easterEggTriggered = true;
          displayCard.classList.add("easter-egg-active");
          triggerHaptic([20, 40, 35]);
          return;
        }

        if (!currentInput) return;
        const evaluated = evaluateExpression(currentInput);
        if (evaluated === null) {
          updateScreen(currentInput, "Error");
          currentInput = "";
        } else {
          const formatted = formatResult(evaluated);
          updateScreen(currentInput, formatted);
          currentInput = String(evaluated);
        }
        return;
      }

      // Any number or operator key after Easter Egg resets to normal mode
      exitEasterEggIfActive();

      const operators = ["+", "-", "×", "÷"];
      const lastChar = currentInput.slice(-1);

      if (operators.includes(key)) {
        if (!currentInput && key !== "-") return;
        if (operators.includes(lastChar)) {
          currentInput = currentInput.slice(0, -1) + key;
        } else {
          currentInput += key;
        }
      } else if (key === ".") {
        const parts = currentInput.split(/[+\-×÷]/);
        const currentNumber = parts[parts.length - 1];
        if (!currentNumber.includes(".")) {
          currentInput += currentNumber === "" ? "0." : ".";
        }
      } else {
        currentInput += key;
      }

      // Live calculation preview when expression has a trailing number
      const liveVal = evaluateExpression(currentInput);
      const hasOperator = /[+\-×÷]/.test(currentInput.slice(1));
      if (hasOperator && liveVal !== null && !operators.includes(currentInput.slice(-1))) {
        updateScreen(currentInput, formatResult(liveVal));
      } else {
        updateScreen("", currentInput || "0");
      }
    }

    function evaluateExpression(expr) {
      if (!expr) return 0;
      const sanitized = expr
        .replace(/,/g, "")
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/[+\-*/.]$/, "");

      if (!sanitized) return 0;
      try {
        const val = Function(`"use strict"; return (${sanitized})`)();
        if (!isFinite(val) || isNaN(val)) return null;
        return val;
      } catch {
        return null;
      }
    }

    function formatResult(num) {
      const rounded = Number(Math.round(num + "e10") + "e-10");
      if (Math.abs(rounded) >= 1e12 || (Math.abs(rounded) > 0 && Math.abs(rounded) < 1e-7)) {
        return rounded.toExponential(4);
      }
      return rounded.toLocaleString("en-IN", { maximumFractionDigits: 8 });
    }

    function updateScreen(exprText, mainText) {
      exprEl.innerText = exprText;
      resultEl.innerText = mainText;
    }

    // Keyboard support
    window.addEventListener("keydown", (e) => {
      const key = e.key;
      let targetKey = null;
      if (key >= "0" && key <= "9") targetKey = key;
      else if (key === ".") targetKey = ".";
      else if (key === "+") targetKey = "+";
      else if (key === "-") targetKey = "-";
      else if (key === "*") targetKey = "×";
      else if (key === "/") targetKey = "÷";
      else if (key === "Enter" || key === "=") { e.preventDefault(); targetKey = "="; }
      else if (key === "Backspace") targetKey = "DEL";
      else if (key === "Escape" || key.toLowerCase() === "c") targetKey = "AC";
      else if (key.toLowerCase() === "s") targetKey = "SQ";
      else if (key === "^") targetKey = "CB";

      if (targetKey) {
        const btn = document.querySelector(`.calc-btn[data-key="${targetKey}"]`);
        if (btn) pressButton(btn, targetKey);
      }
    });

    // PWA Service Worker Registration
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
