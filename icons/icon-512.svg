<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2024"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E4D"/>
      <stop offset="100%" stop-color="#EB0028"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#EB0028" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="#32353D" stroke-width="4" fill="none"/>

  <!-- Iconic Circular Keypad Buttons Preview -->
  <circle cx="160" cy="180" r="42" fill="#2C2E35"/>
  <text x="160" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#E1E3E8" text-anchor="middle">x²</text>

  <circle cx="266" cy="180" r="42" fill="#2C2E35"/>
  <text x="266" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#E1E3E8" text-anchor="middle">x³</text>

  <circle cx="372" cy="180" r="42" fill="#3C4452"/>
  <text x="372" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#D3E3FD" text-anchor="middle">÷</text>

  <!-- Middle Row Dots / Buttons -->
  <circle cx="160" cy="286" r="42" fill="#2C2E35"/>
  <text x="160" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#F0F1F5" text-anchor="middle">7</text>

  <circle cx="266" cy="286" r="42" fill="#2C2E35"/>
  <text x="266" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#F0F1F5" text-anchor="middle">8</text>

  <circle cx="372" cy="286" r="42" fill="#3C4452"/>
  <text x="372" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#D3E3FD" text-anchor="middle">×</text>

  <!-- Bottom Row: OnePlus Red Equals Button -->
  <circle cx="160" cy="392" r="42" fill="#2C2E35"/>
  <text x="160" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#F0F1F5" text-anchor="middle">0</text>

  <circle cx="266" cy="392" r="42" fill="#2C2E35"/>
  <text x="266" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#F0F1F5" text-anchor="middle">.</text>

  <circle cx="372" cy="392" r="46" fill="url(#redGlow)" filter="url(#shadow)"/>
  <text x="372" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">=</text>

  <!-- Cal-C Wordmark Header in Icon -->
  <text x="256" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">Cal-C</text>
  <circle cx="320" cy="80" r="5" fill="#EB0028"/>
</svg>
